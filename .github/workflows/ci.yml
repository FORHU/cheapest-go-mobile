name: CI

on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate FAOS Architecture
        run: dart run tools/validate_architecture.dart

      - name: Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test
