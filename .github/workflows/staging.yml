name: Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same version CI checks against — see the note in `ci.yml`. A build that floats on
      # whatever stable shipped that morning can fail on an SDK it was never tried against,
      # and this workflow produces the artefact people install.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate FAOS Architecture
        run: dart run tools/validate_architecture.dart

      - name: Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

  build-android:
    name: Build Android (Staging)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug
