# How V2's copy becomes Dart. See docs/adr/0002.
#
# The .arb files under lib/l10n are generated by tools/sync_design.dart from V2's own
# en/ja/ko/zh JSON at the pinned commit. Editing them by hand puts this app's wording out of
# step with the website, which the drift check in CI will fail.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations

# Flutter 3.47 removed the synthetic package, so the classes are written into the tree.
output-dir: lib/l10n/generated

# A key present in English and missing elsewhere is a gap in V2's own translations, not ours.
# Listing them is useful; failing the build over them would make this repo the gatekeeper of
# someone else's translation backlog.
untranslated-messages-file: lib/l10n/untranslated.json

