name: cheapest_go_mobile
description: "CheapestGo Mobile App — Flutter 3-Tier FAOS Architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^15.1.1
  http: ^1.3.0
  shared_preferences: ^2.5.2
  mapbox_maps_flutter: ^2.31.0
  geolocator: ^14.1.2
  flutter_localizations:
    sdk: flutter
  intl: any
  lucide_icons_flutter: 4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # V2's copy, converted to ARB by tools/sync_design.dart. See docs/adr/0002.
  generate: true
  assets:
    - assets/images/hotels/
    - assets/images/rooms/
    - assets/images/golf/
    - assets/images/places/

  # Bundled rather than fetched at runtime. V2 asks for these two by name in its --font-sans
  # and --font-mono stacks; an app that tracks a flight offline cannot wait on Google to find
  # out what it looks like. See docs/adr/0002.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
