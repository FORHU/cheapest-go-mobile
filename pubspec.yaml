name: cheapest_go_mobile
description: "CheapestGo Mobile App — Flutter 3-Tier FAOS Architecture."
publish_to: 'none'
version: 1.4.1+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.3
  go_router: ^15.1.1
  http: ^1.3.0
  shared_preferences: ^2.5.2
  mapbox_maps_flutter: ^2.31.0
  geolocator: ^14.1.2
  flutter_localizations:
    sdk: flutter
  intl: any
  lucide_icons_flutter: 4.0.2
  flutter_stripe: ^14.2.0
  printing: ^5.15.1
  pdf: ^3.13.1
  file_picker: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generates the launcher icons for every density from one source image. A dev dependency:
  # it runs once to write android/app/src/main/res, and nothing in the app imports it.
  flutter_launcher_icons: ^0.14.4
  image: ^4.3.0

flutter:
  uses-material-design: true
  # V2's copy, converted to ARB by tools/sync_design.dart. See docs/adr/0002.
  generate: true
  assets:
    - assets/images/hotels/
    - assets/images/rooms/
    - assets/images/golf/
    - assets/images/places/
    # V2's own destination photography, copied from its public/images/destinations so the
    # landing shows the same places it does. See #38.
    - assets/images/destinations/
    # AirangGo brand marks: the launcher source and the in-app wordmark.
    #
    # `airanggo_icon_fg.png` is the adaptive icon's foreground, the same artwork Android
    # draws in the launch window. The splash shows it so the handover from that window is
    # invisible — which only works if it is bundled, and it was not: declaring the folder's
    # siblings individually meant the splash asked for a file the APK did not carry, and
    # the image service threw on every launch.
    - assets/images/airanggo_icon_fg.png
    - assets/images/airanggo_mark.png
    - assets/images/airanggo_wordmark.png

  # Bundled rather than fetched at runtime. V2 asks for these two by name in its --font-sans
  # and --font-mono stacks; an app that tracks a flight offline cannot wait on Google to find
  # out what it looks like. See docs/adr/0002.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500

# The AirangGo launcher icon, generated from assets/images/airanggo_mark.png.
#
# The source is 229x203 with a transparent background, so it is padded to square and laid on
# white first (tool/make_icon.dart): the mark's "A" is black, which disappears against a dark
# launcher background, and a non-square source would be stretched to fit.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/airanggo_icon_src.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/airanggo_icon_fg.png"
  min_sdk_android: 21
